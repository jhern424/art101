<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashlight Explorer - Santa Cruz</title>
    <link rel="stylesheet" href="env03.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="env03.js" defer></script>
</head>

<body>
    <div class="container">
        <img src="images/santa_cruz_1.png" id="background-img" alt="Santa Cruz">
        <div id="overlay"></div>
        <div id="flashlight"></div>
    </div>

    <div class="controls">
        <div class="control-row">
            <button id="up-button">↑ Up</button>
        </div>
        <div class="control-row">
            <button id="left-button">← Left</button>
            <button id="down-button">↓ Down</button>
            <button id="right-button">→ Right</button>
        </div>
    </div>

    <div class="button"><a href="../index.html">Go back to index</a></div>
    <div id="info-text" class="info-text"></div>
    <img src="images/illus-seb.png" alt="Illustration" class="right-image">
</body>

</html>
