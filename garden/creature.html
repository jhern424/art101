<!DOCTYPE html>
<html lang="en">

<head>
   <!-- All techy stuff goes here, inside HEAD -->
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- Overall title of your page -->
   <title>Empty Template</title>
   <!-- Link to external CSS file -->
   <link rel="stylesheet" href="creature.css">
   <!-- jQuery library -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
   <!-- Link to external JavaScript file -->
   <script src="creature.js" DEFER></script>
</head>

<body>
   <!-- Main content goes here, inside BODY -->

   <h1>Creatures Garden</h1>

   <div id="creature-form">
    <h2> Add a Creature </h2>
    <input type="text" id="crName" placeholder="Creature Name">
    <input type="color" id="crColor" value="#ff6b6b">
    <input type="number" id="crEyesNum" placeholder="Number of Eyes" min="1" max="10" value="2">
    <select id="crShape">
        <option value="circle">Circle</option>
        <option value="square">Square</option>
        <option value="triangle">Triangle</option>
    </select>
    <button id="add-creature">Let it Roam!</button>
    </div>

   </div>

    <div id="creature-list">

    </div>

</body>
</html>
